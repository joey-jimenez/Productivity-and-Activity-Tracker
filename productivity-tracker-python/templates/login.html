{% extends "base.html" %}{% block title %}Log In | Productivity Tracker{% endblock %}{% block body %}
<main
    class="auth-page">
    <section class="auth-card">
        <h1>Productivity Tracker</h1>
        <p class="muted">Log in to view and manage your activities.</p>{% include "messages.html" %}
        <form method="post">
            <label>Username</label>
            <input name="username" required>
            <label>Password</label>
            <input name="password" type="password" required>
            <button>Log In</button>
        </form>
        <p class="center">No account? <a href="{{ url_for('register') }}">Create one</a></p>
    </section>
</main>{% endblock %}
